[project]
name = "master-node"
version = "0.1.0"
description = "Lab master node: decodes protocols and sequences Jetson Thor, Opentrons Flex and Tecan."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
master-node = "master_node.main:serve"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["master_node*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
