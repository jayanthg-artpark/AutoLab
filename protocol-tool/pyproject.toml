[project]
name = "protocol-tool"
version = "0.2.0"
description = "Design lab experiments with Claude, simulate them on an Opentrons Flex, and send them to the master node."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.11",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "pydantic>=2.6",
  # Reads attached PDFs for models without native PDF support (Gemini, Ollama).
  "pypdf>=4",
  # Curve fitting for result analysis (standard curves, 4PL/5PL, qPCR efficiency).
  "numpy>=1.24",
  "scipy>=1.11",
  # The Opentrons simulator, pinned to the lab Flex's robot software version (9.1.2, API up to
  # 2.29) so protocols are checked exactly as the robot will. Update both together.
  # Can live in a separate environment instead; see [simulator] python.
  "opentrons==9.1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
protocol-tool = "protocol_tool.main:serve"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["protocol_tool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
